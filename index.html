<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" id="themeColor" content="#0b4a53">
  <meta name="description" content="Searchable Ventura Penal organized into twelve legal titles with related-offense discovery.">
  <title>Ventura Penal</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183236;
      --muted: #61777a;
      --page: #f3efe5;
      --navy: #0b4a53;
      --surface: #fffdf8;
      --surface-2: #e7f0ed;
      --line: rgba(27, 82, 86, .14);
      --line-strong: rgba(27, 82, 86, .25);
      --gold: #c87e32;
      --gold-soft: rgba(200, 126, 50, .12);
      --primary: #087f8c;
      --primary-soft: rgba(8, 127, 140, .1);
      --infraction: #1977b8;
      --misdemeanor: #bf671f;
      --felony: #c33b50;
      --capital: #248553;
      --shadow: 0 22px 60px rgba(25, 61, 61, .13);
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: Georgia, "Times New Roman", serif;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #edf7f5;
      --muted: #9eb4b3;
      --page: #061518;
      --navy: #082f36;
      --surface: #0c2328;
      --surface-2: #133139;
      --line: rgba(157, 209, 207, .15);
      --line-strong: rgba(157, 209, 207, .27);
      --gold: #e9ac61;
      --gold-soft: rgba(233, 172, 97, .13);
      --primary: #52c7c8;
      --primary-soft: rgba(82, 199, 200, .12);
      --infraction: #64b6ff;
      --misdemeanor: #ffab67;
      --felony: #ff7184;
      --capital: #65dc91;
      --shadow: 0 28px 80px rgba(0, 0, 0, .3);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 88% -10%, rgba(46, 150, 158, .17), transparent 33rem),
        radial-gradient(circle at -8% 8%, rgba(222, 154, 78, .13), transparent 27rem),
        var(--page);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
    }
    html[data-theme="dark"] body {
      background:
        radial-gradient(circle at 88% -10%, rgba(36, 139, 145, .19), transparent 33rem),
        radial-gradient(circle at -8% 8%, rgba(203, 125, 50, .08), transparent 27rem),
        var(--page);
    }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid rgba(8, 127, 140, .42); outline-offset: 2px; }

    .site-header {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(circle at 84% 0%, rgba(89, 181, 180, .24), transparent 28rem),
        linear-gradient(135deg, #0d5660, #073a43 68%);
      color: #f5fbfa;
    }
    .site-header::after {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0 79px, rgba(255,255,255,.025) 80px);
      content: "";
      pointer-events: none;
    }
    .masthead {
      position: relative;
      z-index: 1;
      width: min(1400px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 30px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .brand { min-width: 0; }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 600;
      letter-spacing: -.025em;
      line-height: 1.05;
    }
    h1 {
      animation: ventura-category-cycle 9s ease-in-out infinite;
    }
    @keyframes ventura-category-cycle {
      0%, 100% { color: var(--infraction); }
      25% { color: var(--misdemeanor); }
      50% { color: var(--felony); }
      75% { color: var(--capital); }
    }
    .subtitle { margin: 7px 0 0; color: #bed4d3; font-size: 13px; }
    .masthead-meta {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .theme-button {
      min-height: 39px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid rgba(194, 238, 235, .3);
      border-radius: 11px;
      background: rgba(3, 31, 36, .18);
      color: #effcf9;
      font-weight: 700;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .theme-button:hover { transform: translateY(-1px); background: rgba(212, 244, 241, .15); border-color: rgba(212, 244, 241, .62); }
    .theme-icon { width: 17px; font-size: 15px; text-align: center; }

    .mobile-chapter-bar {
      display: none;
      width: min(1400px, calc(100% - 30px));
      margin: 18px auto 0;
    }
    .mobile-chapter-bar label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 700; }

    .book-layout {
      width: min(1400px, calc(100% - 40px));
      margin: 28px auto 64px;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 26px;
      align-items: start;
    }
    .toc {
      position: sticky;
      top: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 253, 248, .9);
      box-shadow: 0 18px 50px rgba(25, 61, 61, .1);
      backdrop-filter: blur(18px);
    }
    html[data-theme="dark"] .toc { background: rgba(10, 31, 36, .9); box-shadow: 0 18px 50px rgba(0, 0, 0, .18); }
    .toc-header {
      padding: 17px 17px 13px;
      border-bottom: 1px solid var(--line);
    }
    .toc-kicker { display: block; color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .toc-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 3px; }
    .toc-title strong { font-family: var(--serif); font-size: 20px; }
    .toc-title span { color: var(--muted); font-size: 11px; }
    .toc-list { padding: 8px; }
    .toc-link {
      display: grid;
      grid-template-columns: 31px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 40px;
      padding: 7px 9px;
      border-radius: 10px;
      color: var(--muted);
      text-decoration: none;
      transition: color .15s ease, background .15s ease;
    }
    .toc-link:hover, .toc-link.is-active { background: rgba(8, 127, 140, .09); color: var(--ink); }
    html[data-theme="dark"] .toc-link:hover,
    html[data-theme="dark"] .toc-link.is-active { background: rgba(82, 199, 200, .1); }
    .toc-link.is-empty { opacity: .4; }
    .toc-number { color: var(--gold); font-family: var(--serif); font-size: 12px; }
    .toc-name { overflow: hidden; font-size: 11px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .toc-count { min-width: 25px; padding: 2px 6px; border-radius: 999px; background: rgba(8, 127, 140, .07); font-size: 10px; text-align: center; }
    html[data-theme="dark"] .toc-count { background: rgba(82, 199, 200, .08); }

    .reading-pane { min-width: 0; }
    .search-panel {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 253, 248, .92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }
    html[data-theme="dark"] .search-panel { background: rgba(9, 29, 34, .93); }
    .search-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 210px auto;
      gap: 11px;
      align-items: end;
    }
    .field { min-width: 0; }
    .field label { display: block; margin: 0 0 6px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .025em; }
    .search-wrap { position: relative; }
    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      color: #718099;
      font-size: 16px;
      transform: translateY(-50%);
      pointer-events: none;
    }
    input[type="search"], select {
      width: 100%;
      min-height: 45px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: rgba(255, 255, 255, .86);
      color: var(--ink);
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input[type="search"] { padding: 0 42px 0 39px; }
    select { padding: 0 12px; }
    input[type="search"]::placeholder { color: #87999a; }
    html[data-theme="dark"] input[type="search"],
    html[data-theme="dark"] select { background: rgba(4, 17, 21, .76); }
    html[data-theme="dark"] input[type="search"]::placeholder { color: #6f898a; }
    input[type="search"]:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(8, 127, 140, .11); }
    .clear-search {
      position: absolute;
      right: 7px;
      top: 50%;
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      transform: translateY(-50%);
    }
    .clear-search:hover { background: rgba(8, 127, 140, .08); color: var(--ink); }
    html[data-theme="dark"] .clear-search:hover { background: rgba(82, 199, 200, .09); }
    .clear-search[hidden] { display: none; }
    .reset-button {
      min-height: 45px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--ink);
      font-weight: 700;
    }
    .reset-button:hover { border-color: rgba(8, 127, 140, .55); }
    .results-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .book { margin-top: 23px; }
    .law-title {
      scroll-margin-top: 154px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 253, 248, .86);
      box-shadow: 0 18px 50px rgba(25, 61, 61, .09);
    }
    html[data-theme="dark"] .law-title { background: rgba(10, 29, 34, .82); box-shadow: 0 18px 50px rgba(0, 0, 0, .17); }
    .title-heading {
      position: relative;
      padding: 25px 26px 22px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(200, 126, 50, .1), transparent 48%),
        linear-gradient(180deg, rgba(235, 244, 239, .96), rgba(225, 238, 233, .92));
    }
    html[data-theme="dark"] .title-heading {
      background:
        linear-gradient(90deg, rgba(233, 172, 97, .1), transparent 48%),
        linear-gradient(180deg, rgba(20, 48, 54, .96), rgba(11, 31, 36, .94));
    }
    .title-heading::after {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      background: var(--gold);
      content: "";
    }
    .title-label { color: var(--gold); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .title-heading h2 { margin: 5px 0 0; font-family: var(--serif); font-size: clamp(23px, 3vw, 31px); font-weight: 600; letter-spacing: -.02em; }
    .title-meta { display: flex; flex-wrap: wrap; gap: 8px 15px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .statutes { padding: 0 21px; }
    .statute {
      position: relative;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      min-height: 84px;
      padding: 16px 4px;
      border-bottom: 1px solid rgba(27, 82, 86, .11);
    }
    .statute:last-child { border-bottom: 0; }
    .statute::before {
      position: absolute;
      left: -21px;
      top: 13px;
      bottom: 13px;
      width: 3px;
      border-radius: 0 4px 4px 0;
      background: var(--category-color);
      content: "";
    }
    .statute-number { color: #31585c; font-family: var(--serif); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
    html[data-theme="dark"] .statute-number { color: #c6d8d7; }
    .statute-name { margin: 0; font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.3; }
    .statute-meta { display: flex; align-items: center; justify-content: flex-end; gap: 9px; }
    .classification {
      min-height: 27px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      border: 1px solid color-mix(in srgb, var(--category-color) 38%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--category-color) 10%, transparent);
      color: var(--category-color);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .055em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .penalty { min-width: 58px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .category-infraction { --category-color: var(--infraction); }
    .category-misdemeanor { --category-color: var(--misdemeanor); }
    .category-felony { --category-color: var(--felony); }
    .category-capital { --category-color: var(--capital); }
    .empty-state {
      padding: 72px 24px;
      border: 1px dashed var(--line-strong);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
    }
    .empty-state strong { display: block; margin-bottom: 5px; color: var(--ink); font-family: var(--serif); font-size: 22px; }
    @media (max-width: 980px) {
      .mobile-chapter-bar { display: block; }
      .book-layout { grid-template-columns: 1fr; margin-top: 16px; }
      .toc { display: none; }
      .search-grid { grid-template-columns: minmax(0, 1fr) 190px auto; }
      .law-title { scroll-margin-top: 175px; }
    }
    @media (max-width: 720px) {
      .masthead { width: min(100% - 30px, 1400px); padding: 25px 0 23px; align-items: flex-start; }
      .masthead-meta { flex-direction: column; align-items: stretch; }
      .book-layout { width: min(100% - 30px, 1400px); }
      .search-panel { position: relative; }
      .search-grid { grid-template-columns: 1fr 1fr; }
      .field-search { grid-column: 1 / -1; }
      .reset-button { align-self: end; }
      .law-title { scroll-margin-top: 20px; }
      .title-heading { padding: 21px 20px 18px; }
      .statutes { padding: 0 17px; }
      .statute { grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding: 15px 2px; }
      .statute::before { left: -17px; }
      .statute-name { font-size: 17px; }
      .statute-meta { grid-column: 2; justify-content: flex-start; margin-top: -5px; }
    }
    @media (max-width: 480px) {
      .masthead { flex-direction: column; gap: 16px; }
      .subtitle { font-size: 12px; }
      .masthead-meta { width: 100%; margin-left: 0; }
      .theme-button { width: 100%; }
      .search-grid { grid-template-columns: 1fr; }
      .field-search { grid-column: auto; }
      .reset-button { width: 100%; }
      .title-heading h2 { font-size: 23px; }
      .statute { grid-template-columns: 1fr; gap: 4px; }
      .statute-number { font-size: 15px; }
      .statute-meta { grid-column: auto; justify-content: space-between; margin-top: 7px; }
      .statute-name { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
      h1 { animation: none; color: var(--infraction); }
    }
    @media print {
      :root { color-scheme: light; --ink: #111; --muted: #555; --page: #fff; --surface: #fff; --surface-2: #f4f4f4; --line: #bbb; --line-strong: #999; }
      body { background: #fff; }
      .site-header, .mobile-chapter-bar, .toc, .search-panel { display: none !important; }
      .book-layout { display: block; width: 100%; margin: 0; }
      .book { margin: 0; }
      .law-title { break-before: page; border: 0; box-shadow: none; }
      .law-title:first-child { break-before: auto; }
      .title-heading { background: #eee; }
      .statute { break-inside: avoid; }
    }
  </style>
</head>

      <div class="book" id="book"></div>
    </section>
  </main>

          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function titleCase(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function initialTheme() {
        try {
          var savedTheme = window.localStorage.getItem('ventura-theme');
          if (savedTheme === 'light' || savedTheme === 'dark') return savedTheme;
        } catch (error) {}
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function applyTheme(theme, remember) {
        document.documentElement.dataset.theme = theme;
        var isDark = theme === 'dark';
        themeToggle.setAttribute('aria-pressed', String(isDark));
        themeIcon.textContent = isDark ? '☀' : '☾';
        themeLabel.textContent = isDark ? 'Light mode' : 'Dark mode';
        themeColor.setAttribute('content', isDark ? '#061518' : '#0b4a53');
        if (remember) {
          try { window.localStorage.setItem('ventura-theme', theme); } catch (error) {}
        }
      }

      function normalize(value) {
        return String(value)
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, ' ')
          .trim();
      }

      function withinOneEdit(left, right) {
        if (left === right) return true;
        if (Math.abs(left.length - right.length) > 1) return false;
        var longer = left.length >= right.length ? left : right;
        var shorter = left.length >= right.length ? right : left;
        var longIndex = 0;
        var shortIndex = 0;
        var edits = 0;
        while (longIndex < longer.length && shortIndex < shorter.length) {
          if (longer[longIndex] === shorter[shortIndex]) {
            longIndex += 1;
            shortIndex += 1;
          } else {
            edits += 1;
            if (edits > 1) return false;
            longIndex += 1;
            if (longer.length === shorter.length) shortIndex += 1;
          }
        }
        return true;
      }

      function relatedFamilies(query) {
        if (!query) return [];
        var words = query.split(' ').filter(function (word) { return word.length > 2; });
        return offenseFamilies.filter(function (family) {
          return family.triggers.some(function (trigger) {
            var normalizedTrigger = normalize(trigger);
            if (query.indexOf(normalizedTrigger) !== -1 || normalizedTrigger.indexOf(query) !== -1) return true;
            return words.some(function (word) {
              return word === normalizedTrigger || (word.length > 3 && withinOneEdit(word, normalizedTrigger));
            });
          });
        });
      }

      function sectionFor(charge) {
        return sections.find(function (section) {
          return charge.code >= section.min && charge.code <= section.max;
        });
      }

      function searchScore(charge, query) {
        if (!query) return 1;
        var section = sectionFor(charge);
        var name = normalize(charge.name);
        var context = normalize([charge.code, charge.name, charge.category, section.title, section.label].join(' '));
        var words = query.split(' ').filter(Boolean);

        if (/^\d+$/.test(query)) return String(charge.code) === query ? 10000 : 0;
        if (String(charge.code) === query) return 10000;
        if (name === query) return 9500;
        if (name.indexOf(query) === 0) return 9000;
        if (name.indexOf(query) !== -1) return 8500;
        if (words.length && words.every(function (word) { return context.indexOf(word) !== -1; })) return 7500;

        var families = relatedFamilies(query);
        var related = families.some(function (family) {
          return family.related.some(function (term) { return name.indexOf(normalize(term)) !== -1; });
        });
        if (related) return 5500;

        if (context.indexOf(query) !== -1) return 4500;
        var contextWords = context.split(' ');
        var fuzzy = words.some(function (word) {
          if (word.length < 4) return false;
          return contextWords.some(function (candidate) {
            return candidate.indexOf(word) === 0 || withinOneEdit(word, candidate);
          });
        });
        if (fuzzy) return 2500;
        return 0;
      }

      function filteredCharges() {
        var query = normalize(searchInput.value);
        var classification = categoryFilter.value;
        return charges.filter(function (charge) {
          var categoryMatches = classification === 'all' || charge.category === classification;
          return categoryMatches && searchScore(charge, query) > 0;
        });
      }

      function statuteMarkup(charge) {
        return '<article class="statute category-' + charge.category + '">' +
          '<div class="statute-number">' + charge.code + '</div>' +
          '<h3 class="statute-name">' + escapeHtml(charge.name) + '</h3>' +
          '<div class="statute-meta">' +
            '<span class="classification">' + titleCase(charge.category) + '</span>' +
            '<span class="penalty">' + charge.mins + ' min</span>' +
          '</div>' +
        '</article>';
      }

      function sectionMarkup(section, items) {
        return '<section class="law-title" id="title-' + section.id + '">' +
          '<header class="title-heading">' +
            '<div class="title-label">Title ' + section.roman + '</div>' +
            '<h2>' + escapeHtml(section.title) + '</h2>' +
            '<div class="title-meta"><span>' + section.min + '–' + section.max + '</span><span>' + items.length + ' ' + (items.length === 1 ? 'statute' : 'statutes') + '</span></div>' +
          '</header>' +
          '<div class="statutes">' + items.map(statuteMarkup).join('') + '</div>' +
        '</section>';
      }

      function renderNavigation(counts) {
        tocList.innerHTML = sections.map(function (section) {
          var count = counts[section.id] || 0;
          return '<a class="toc-link' + (count ? '' : ' is-empty') + '" href="#title-' + section.id + '" data-section="' + section.id + '">' +
            '<span class="toc-number">' + section.roman + '</span>' +
            '<span class="toc-name">' + escapeHtml(section.title) + '</span>' +
            '<span class="toc-count">' + count + '</span>' +
          '</a>';
        }).join('');
      }

      function render() {
        var filtered = filteredCharges();
        var query = normalize(searchInput.value);
        var visibleSections = [];
        var counts = {};

        sections.forEach(function (section) {
          var items = filtered
            .filter(function (charge) { return sectionFor(charge).id === section.id; })
            .sort(function (left, right) {
              return searchScore(right, query) - searchScore(left, query) || left.code - right.code;
            });
          counts[section.id] = items.length;
          if (items.length) visibleSections.push({ section: section, items: items });
        });

        if (visibleSections.length) {
          book.innerHTML = visibleSections.map(function (group) {
            return sectionMarkup(group.section, group.items);
          }).join('');
        } else {
          book.innerHTML = '<div class="empty-state"><strong>No matching statutes</strong><span>Try another number, charge name, title, or classification.</span></div>';
        }

        var related = relatedFamilies(query).length > 0;
        var resultLead = filtered.length + ' ' + (filtered.length === 1 ? 'statute' : 'statutes');
        if (query) resultLead += related ? ' related to “' + searchInput.value.trim() + '”' : ' matching “' + searchInput.value.trim() + '”';
        resultStatus.textContent = resultLead + ' across ' + visibleSections.length + ' ' + (visibleSections.length === 1 ? 'title' : 'titles');
        clearSearch.hidden = searchInput.value.length === 0;
        renderNavigation(counts);
      }

      function reset() {
        searchInput.value = '';
        categoryFilter.value = 'all';
        render();
        searchInput.focus();
      }

      chapterSelect.innerHTML = '<option value="">Jump to a title…</option>' + sections.map(function (section) {
        return '<option value="title-' + section.id + '">Title ' + section.roman + ' — ' + escapeHtml(section.title) + '</option>';
      }).join('');

      searchInput.addEventListener('input', render);
      categoryFilter.addEventListener('change', render);
      clearSearch.addEventListener('click', function () { searchInput.value = ''; render(); searchInput.focus(); });
      resetFilters.addEventListener('click', reset);
      themeToggle.addEventListener('click', function () {
        var nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme, true);
      });
      chapterSelect.addEventListener('change', function () {
        if (!chapterSelect.value) return;
        var target = document.getElementById(chapterSelect.value);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        chapterSelect.value = '';
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === '/' && document.activeElement !== searchInput && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
          event.preventDefault();
          searchInput.focus();
        }
        if (event.key === 'Escape' && document.activeElement === searchInput && searchInput.value) {
          searchInput.value = '';
          render();
        }
      });

      applyTheme(initialTheme(), false);
      render();
    }());
  </script>
</body>
</html>
